[project]
name = "chinook-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.0",
    "langchain-anthropic>=1.7.4",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chinook_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["live: needs a real model API key"]
addopts = "-m 'not live'"
