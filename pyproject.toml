[project]
name = "chinook"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8", "debugpy>=1.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chinook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "."]
markers = ["live: needs a real model API key"]
addopts = "-m 'not live'"
